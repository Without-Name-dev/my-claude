name: ClaudeRemote
options:
  bundleIdPrefix: app.jade5197
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "9.9.10"
    CURRENT_PROJECT_VERSION: "1001"
    DEVELOPMENT_TEAM: ""

targets:
  ClaudeRemote:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    # Keep the plist out of `sources`; otherwise Xcode sees two build commands
    # producing the same Info.plist.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Claude Remote
        CFBundleName: ClaudeRemote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        # A real launch screen opts the app into native-resolution rendering.
        # Without it iOS runs the app letterboxed with black bars and a zoomed
        # web viewport. The mark keeps the launch screen from reading as a
        # blank white page and lines up with the in-app splash.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jade5197.gypsum9420
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        # Older signers do not understand Xcode 26 chained fixups.
        OTHER_LDFLAGS: "-Wl,-no_fixup_chains"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
