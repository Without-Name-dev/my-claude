name: CI

# One workflow for buildable and statically checkable components. The `changes`
# job runs only checks affected by the changed paths.

on:
  pull_request:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # This repository intentionally does not commit Yarn or uv lockfiles.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Headless checks do not need an Electron binary or dependency install scripts.
  YARN_ENABLE_SCRIPTS: "false"
  UV_DEFAULT_INDEX: https://pypi.org/simple
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22.23.2

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      connector: ${{ steps.paths.outputs.connector }}
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      go: ${{ steps.paths.outputs.go }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select checks for changed paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          connector=false
          server=false
          web=false
          go=false

          run_everything() {
            echo "::notice::$1; running every check"
            connector=true
            server=true
            web=true
            go=true
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            run_everything "manual run"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            # A push that creates a branch has no `before` commit to diff against.
            run_everything "no base commit"
          else
            # Only the two commits are needed for a tree diff.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/*|contracts/*)
                  run_everything "shared file changed: $path"
                  ;;
                connector/*) connector=true ;;
                server/*) server=true ;;
                web-next/*) web=true ;;
                go/*) go=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi

          for scope in connector server web go; do
            echo "$scope=${!scope}" >> "$GITHUB_OUTPUT"
            echo "$scope: ${!scope}"
          done

  connector:
    name: Connector syntax
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile Connector sources
        run: python -m compileall -q connector/connector

  server:
    name: Server syntax
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile Server sources
        run: python -m compileall -q server/agent_server

  web:
    name: Web headless checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install client dependencies
        run: corepack yarn install
      - name: Verify Web
        run: |
          corepack yarn typecheck
          corepack yarn protocol:check

  go:
    name: Go build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build Server and Connector
        working-directory: go
        run: go build ./cmd/aa-server ./cmd/aa-connector

  deploy-server:
    name: Deploy server binary
    needs: [changes, go]
    # Push to main only, and only when Go sources changed. The server applies it
    # from /opt/agents-anywhere/incoming within a minute (root-owned timer), so
    # CI never needs a root key or sudo.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build Linux server
        working-directory: go
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o aa-server ./cmd/aa-server
          sha256sum aa-server
      - name: Stage it on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::DEPLOY_SSH_KEY is not set; skipping the server deploy"
            exit 0
          fi
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            go/aa-server deploy@8.166.138.207:/opt/agents-anywhere/incoming/aa-server.part
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            deploy@8.166.138.207 'mv /opt/agents-anywhere/incoming/aa-server.part /opt/agents-anywhere/incoming/aa-server'

  deploy-web:
    name: Deploy Web client
    needs: [changes, web]
    # Push to main only, and only when web sources changed. The same root-owned
    # applier swaps the extracted directory, keeping the previous build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install client dependencies
        run: corepack yarn install
      - name: Build the static export
        env:
          NEXT_OUTPUT: export
        run: corepack yarn build
      - name: Package the export
        working-directory: .
        run: tar -czf web.tar.gz -C web-next/out .
      - name: Stage it on the server
        working-directory: .
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::DEPLOY_SSH_KEY is not set; skipping the web deploy"
            exit 0
          fi
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            web.tar.gz deploy@8.166.138.207:/opt/agents-anywhere/incoming/web.tar.gz.part
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            deploy@8.166.138.207 'mv /opt/agents-anywhere/incoming/web.tar.gz.part /opt/agents-anywhere/incoming/web.tar.gz'
