name: CI

# One workflow for buildable and statically checkable components. The `changes`
# job runs only checks affected by the changed paths.

on:
  pull_request:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # This repository intentionally does not commit Yarn or uv lockfiles.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Headless checks do not need an Electron binary or dependency install scripts.
  YARN_ENABLE_SCRIPTS: "false"
  UV_DEFAULT_INDEX: https://pypi.org/simple
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22.23.2

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      connector: ${{ steps.paths.outputs.connector }}
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      go: ${{ steps.paths.outputs.go }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select checks for changed paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          connector=false
          server=false
          web=false
          go=false

          run_everything() {
            echo "::notice::$1; running every check"
            connector=true
            server=true
            web=true
            go=true
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            run_everything "manual run"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            # A push that creates a branch has no `before` commit to diff against.
            run_everything "no base commit"
          else
            # Only the two commits are needed for a tree diff.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/*|contracts/*)
                  run_everything "shared file changed: $path"
                  ;;
                connector/*) connector=true ;;
                server/*) server=true ;;
                web-next/*) web=true ;;
                go/*) go=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi

          for scope in connector server web go; do
            echo "$scope=${!scope}" >> "$GITHUB_OUTPUT"
            echo "$scope: ${!scope}"
          done

  connector:
    name: Connector syntax
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile Connector sources
        run: python -m compileall -q connector/connector

  server:
    name: Server syntax
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile Server sources
        run: python -m compileall -q server/agent_server

  web:
    name: Web headless checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install client dependencies
        run: corepack yarn install
      - name: Verify Web
        run: |
          corepack yarn typecheck
          corepack yarn protocol:check

  go:
    name: Go build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build Server and Connector
        working-directory: go
        run: go build ./cmd/aa-server ./cmd/aa-connector
