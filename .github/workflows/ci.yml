name: CI

# One workflow for every headless-checkable component. The `changes` job looks
# at the changed paths and turns on only the jobs that can be affected,
# including downstream consumers: the Server tests import the Connector package.

on:
  pull_request:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # This repository intentionally does not commit Yarn or uv lockfiles.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Headless checks do not need an Electron binary or dependency install scripts.
  YARN_ENABLE_SCRIPTS: "false"
  UV_DEFAULT_INDEX: https://pypi.org/simple
  UV_VERSION: 0.12.3
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22.23.2

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      connector: ${{ steps.paths.outputs.connector }}
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select checks for changed paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          connector=false
          server=false
          web=false

          run_everything() {
            echo "::notice::$1; running every check"
            connector=true
            server=true
            web=true
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            run_everything "manual run"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            # A push that creates a branch has no `before` commit to diff against.
            run_everything "no base commit"
          else
            # Only the two commits are needed for a tree diff.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/*|contracts/*)
                  run_everything "shared file changed: $path"
                  ;;
                # Server tests import the Connector package.
                connector/*) connector=true; server=true ;;
                server/*) server=true ;;
                web-next/*) web=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi

          for scope in connector server web; do
            echo "$scope=${!scope}" >> "$GITHUB_OUTPUT"
            echo "$scope: ${!scope}"
          done

  connector:
    name: Connector tests
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: connector/pyproject.toml
      - name: Install Connector dependencies
        run: uv sync --project connector
      - name: Test Connector
        working-directory: connector
        # `timeout` ends a stalled run with the faulthandler stacks still in the
        # log; the job timeout alone would discard them.
        run: timeout 900 uv run --frozen pytest -q -o faulthandler_timeout=120

  server:
    name: Server tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_anywhere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite truncates every table before each test; the name must contain "test".
      AGENT_SERVER_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_anywhere_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            connector/pyproject.toml
            server/pyproject.toml
      - name: Install Server dependencies and the Connector package
        # tests/test_connector_pipeline.py imports the Connector package, so it
        # and its dependencies have to live in the Server environment.
        run: |
          uv sync --project server
          uv pip install --python server/.venv/bin/python ./connector
      - name: Test Server
        working-directory: server
        run: timeout 1200 uv run --frozen pytest -q -o faulthandler_timeout=120

  web:
    name: Web headless checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install client dependencies
        run: corepack yarn install
      - name: Verify Web
        run: |
          corepack yarn test
          corepack yarn typecheck
          corepack yarn protocol:check
