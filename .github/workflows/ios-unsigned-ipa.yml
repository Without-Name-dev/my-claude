name: iOS unsigned IPA

# Builds the iOS client without code signing and uploads an .ipa artifact.
# Sign it locally with Sideloadly (free Apple ID) or your own certificate.
#
# Runs automatically when the iOS client or this workflow changes on main, and
# can also be started from the Actions tab: "iOS unsigned IPA" -> "Run workflow".

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label (macos-26 / macos-latest)"
        required: false
        default: "macos-26"
      deployment_target:
        description: "Optional IPHONEOS_DEPLOYMENT_TARGET override (e.g. 18.0)"
        required: false
        default: ""

permissions:
  # The build publishes the IPA as a release asset so it can be downloaded
  # without signing in, unlike an Actions artifact.
  contents: write

# Builds race on the same release tag: when two finished out of order the older
# commit's IPA became "latest" and the server synced it. Serialize them.
concurrency:
  group: ios-unsigned-ipa
  cancel-in-progress: false

jobs:
  build:
    # macos-26 ships Xcode 26; pass "macos-latest" if that label is unavailable.
    # Push events have no inputs, so fall back to the same label.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          xcodebuild -showsdks | sed -n '1,40p'

      - name: Resolve packages
        working-directory: ios
        run: |
          xcodebuild -project "Agents Anywhere/Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -resolvePackageDependencies

      - name: Build unsigned archive
        working-directory: ios
        run: |
          set -uo pipefail
          EXTRA=()
          if [ -n "${{ inputs.deployment_target }}" ]; then
            EXTRA+=("IPHONEOS_DEPLOYMENT_TARGET=${{ inputs.deployment_target }}")
          fi
          BUILD_LOG="$RUNNER_TEMP/ios-archive.log"
          set +e
          xcodebuild \
            -project "Agents Anywhere/Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            archive 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '(^|[[:space:]])error:|fatal error:' "$BUILD_LOG" | tail -n 40)
          fi
          exit "$BUILD_STATUS"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="ios/build/App.xcarchive/Products/Applications/Agents Anywhere.app"
          test -d "$APP"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry AgentsAnywhere-unsigned.ipa Payload)
          ls -lh out/AgentsAnywhere-unsigned.ipa

      - name: Patch bundle identifier
        # The phone installs this build under a fixed id. The server's sync
        # timer also patches, but the direct upload below publishes the
        # archive immediately — without this step the download URL served an
        # unpatched IPA until the next sync replaced it.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, zipfile
          src = dst = "out/AgentsAnywhere-unsigned.ipa"
          info = "Payload/Agents Anywhere.app/Info.plist"
          zin = zipfile.ZipFile(src)
          if info not in zin.namelist():
              raise SystemExit("unexpected ipa layout")
          data = plistlib.loads(zin.read(info))
          data["CFBundleIdentifier"] = "app.jade5197.gypsum9420"
          blob = plistlib.dumps(data, fmt=plistlib.FMT_BINARY)
          tmp = "out/patched.ipa"
          with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as out:
              for item in zin.infolist():
                  out.writestr(item, blob if item.filename == info else zin.read(item.filename))
          zin.close()
          import os
          os.replace(tmp, dst)
          PY
          unzip -p out/AgentsAnywhere-unsigned.ipa "Payload/Agents Anywhere.app/Info.plist" > /tmp/info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" /tmp/info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgentsAnywhere-unsigned-ipa
          path: out/AgentsAnywhere-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish IPA to the self-hosted server
        # The phone downloads the package from the server's own /dl/ URL, so the
        # build hands it over directly instead of leaving it behind a login.
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::DEPLOY_SSH_KEY is not set; skipping the upload to the server"
            exit 0
          fi
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            deploy@8.166.138.207 'mkdir -p /opt/agents-anywhere/web/dl'
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            out/AgentsAnywhere-unsigned.ipa \
            deploy@8.166.138.207:/opt/agents-anywhere/web/dl/MyClaude.ipa
          echo "uploaded $(stat -c%s out/AgentsAnywhere-unsigned.ipa) bytes"

      - name: Publish IPA as a public release asset
        # Actions artifacts need a signed-in session to download; a release
        # asset on a public repository does not, which is what makes it usable
        # as a plain http URL from the self-hosted server.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create ios-latest out/AgentsAnywhere-unsigned.ipa \
            --title "iOS unsigned IPA (latest)" \
            --notes "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ). Unsigned: sign it before installing."
