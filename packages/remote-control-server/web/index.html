<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f8f7f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11100f" media="(prefers-color-scheme: dark)" />
  <!-- Same markup can be wrapped/served to iOS without a separate shell. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <!-- Everything is same-origin; inline is limited to the critical-paint block
       above. With a CSP in place a failed load shows iOS's error page instead
       of an unexplained blank screen. -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:"
  />
  <title>My Claude</title>
  <script>
    // Apply the saved theme before first paint; otherwise dark-mode users get
    // a flash of the light theme while React mounts.
    (function () {
      document.documentElement.dataset.bootAt = String(Date.now());
      var stored = 'system';
      var dark = false;
      var handlers = null;
      var forced = null;
      try {
        forced = new URLSearchParams(location.search).get('theme');
        stored =
          forced === 'light' || forced === 'dark'
            ? forced
            : localStorage.getItem('theme') || 'system';
        dark =
          stored === 'dark' ||
          (stored === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (error) {}
      // Tell the iOS shell which chrome (status bar, launch + splash colour)
      // to use. It remembers the choice for the next cold launch.
      try {
        handlers = window.webkit && window.webkit.messageHandlers;
        if (handlers && handlers.appearance) {
          handlers.appearance.postMessage(stored);
        }
      } catch (error) {}
    })();
  </script>
  <style>
    /* Critical paint styles. They ship inside the HTML so the very first
       painted frame already has the app background — a WKWebView with no
       stylesheet paints pure white, which is what made launches flash. */
    :root {
      --boot-bg: #f8f7f5;
    }
    html.dark {
      --boot-bg: #11100f;
    }
    html {
      background-color: var(--boot-bg);
      color-scheme: light dark;
    }
    body {
      margin: 0;
      background-color: var(--boot-bg);
    }

    /* Boot splash: the same mark, wordmark and dots as the native shell.
       main.tsx fades it out once React has committed its first frame. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: var(--boot-bg);
      transition: opacity 0.35s ease;
      -webkit-transition: opacity 0.35s ease;
    }
    #boot.is-done {
      opacity: 0;
      pointer-events: none;
    }
    .boot-mark-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 96px;
      height: 96px;
      margin: -48px 0 0 -48px;
      animation: boot-pop 0.55s cubic-bezier(0.22, 0.9, 0.25, 1) both;
    }
    .boot-mark {
      display: block;
      width: 96px;
      height: 96px;
      animation: boot-breathe 1.8s ease-in-out 0.8s infinite alternate;
    }
    .boot-name {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% + 64px);
      font-family: -apple-system, BlinkMacSystemFont, system-ui,
        sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.6px;
      text-align: center;
      color: #8b909a;
      animation: boot-fade 0.4s ease 0.18s both;
    }
    html.dark .boot-name {
      color: #6f7681;
    }
    @keyframes boot-pop {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes boot-breathe {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.045);
      }
    }
    @keyframes boot-fade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-mark-wrap,
      .boot-mark,
      .boot-name {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div class="boot-mark-wrap">
      <!-- Same artwork as the iOS app icon, launch screen and AppMark.tsx:
           blocky body, two black eyes, side arms and four legs. -->
      <svg class="boot-mark" viewBox="0 0 1024 1024" width="96" height="96">
        <g transform="translate(0 55)">
          <g fill="#DF7C57">
            <rect x="170" y="150" width="684" height="470" rx="18" />
            <rect x="60" y="348" width="120" height="108" />
            <rect x="844" y="348" width="120" height="108" />
            <rect x="245" y="612" width="62" height="152" />
            <rect x="380" y="612" width="62" height="152" />
            <rect x="582" y="612" width="62" height="152" />
            <rect x="717" y="612" width="62" height="152" />
          </g>
          <g fill="#161514">
            <rect x="300" y="252" width="58" height="130" rx="10" />
            <rect x="666" y="252" width="58" height="130" rx="10" />
          </g>
        </g>
      </svg>
    </div>
    <div class="boot-name">MY CLAUDE</div>
  </div>
  <!-- Inert until the boot splash fades: a mounted input must not pull the
       keyboard up over the splash. main.tsx lifts it on reveal. -->
  <div id="root" inert></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
