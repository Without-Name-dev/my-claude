<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />
  <!-- Same markup can be wrapped/served to iOS without a separate shell. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <title>Claude Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    // Apply the saved theme before first paint; otherwise dark-mode users get
    // a flash of the light theme while React mounts.
    (function () {
      var stored = 'system';
      var dark = false;
      var handlers = null;
      var forced = null;
      try {
        forced = new URLSearchParams(location.search).get('theme');
        stored =
          forced === 'light' || forced === 'dark'
            ? forced
            : localStorage.getItem('theme') || 'system';
        dark =
          stored === 'dark' ||
          (stored === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (error) {}
      // Tell the iOS shell which chrome (status bar, launch + splash colour)
      // to use. It remembers the choice for the next cold launch.
      try {
        handlers = window.webkit && window.webkit.messageHandlers;
        if (handlers && handlers.appearance) {
          handlers.appearance.postMessage(stored);
        }
      } catch (error) {}
    })();
  </script>
  <style>
    /* Critical paint styles. They ship inside the HTML so the very first
       painted frame already has the app background — a WKWebView with no
       stylesheet paints pure white, which is what made launches flash. */
    :root {
      --boot-bg: #f7f7f8;
    }
    html.dark {
      --boot-bg: #0f1012;
    }
    html {
      background-color: var(--boot-bg);
      color-scheme: light dark;
    }
    body {
      margin: 0;
      background-color: var(--boot-bg);
    }

    /* Boot splash: the same mark, wordmark and dots as the native shell.
       main.tsx fades it out once React has committed its first frame. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: var(--boot-bg);
      transition: opacity 0.35s ease;
      -webkit-transition: opacity 0.35s ease;
    }
    #boot.is-done {
      opacity: 0;
      pointer-events: none;
    }
    .boot-mark-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 96px;
      height: 96px;
      margin: -48px 0 0 -48px;
      animation: boot-pop 0.55s cubic-bezier(0.22, 0.9, 0.25, 1) both;
    }
    .boot-mark {
      display: block;
      width: 96px;
      height: 96px;
      animation: boot-breathe 1.8s ease-in-out 0.8s infinite alternate;
    }
    .boot-name {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% + 64px);
      font-family: -apple-system, BlinkMacSystemFont, "Poppins", system-ui,
        sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.6px;
      text-align: center;
      color: #8b909a;
      animation: boot-fade 0.4s ease 0.18s both;
    }
    html.dark .boot-name {
      color: #6f7681;
    }
    .boot-dots {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% + 96px);
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .boot-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d97757;
      opacity: 0.2;
      animation: boot-dot 1.1s ease-in-out infinite;
    }
    .boot-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }
    .boot-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }
    @keyframes boot-pop {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes boot-breathe {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.045);
      }
    }
    @keyframes boot-fade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes boot-dot {
      0%,
      100% {
        opacity: 0.2;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-mark-wrap,
      .boot-mark,
      .boot-name,
      .boot-dots span {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div class="boot-mark-wrap">
      <!-- Geometry matches the app icon: eight rounded spokes around a
           background-coloured octagon that hosts the centre dot. -->
      <svg class="boot-mark" viewBox="0 0 96 96" width="96" height="96">
        <g fill="#d97757">
          <rect x="42.89" y="3.7" width="10.22" height="36" rx="5.11" />
          <rect
            x="42.89"
            y="3.7"
            width="10.22"
            height="36"
            rx="5.11"
            transform="rotate(45 48 48)"
          />
          <rect
            x="42.89"
            y="3.7"
            width="10.22"
            height="36"
            rx="5.11"
            transform="rotate(90 48 48)"
          />
          <rect
            x="42.89"
            y="3.7"
            width="10.22"
            height="36"
            rx="5.11"
            transform="rotate(135 48 48)"
          />
          <rect
            x="42.89"
            y="3.7"
            width="10.22"
            height="36"
            rx="5.11"
            transform="rotate(180 48 48)"
          />
          <rect
            x="42.89"
            y="3.7"
            width="10.22"
            height="36"
            rx="5.11"
            transform="rotate(225 48 48)"
          />
          <rect
            x="42.89"
            y="3.7"
            width="10.22"
            height="36"
            rx="5.11"
            transform="rotate(270 48 48)"
          />
          <rect
            x="42.89"
            y="3.7"
            width="10.22"
            height="36"
            rx="5.11"
            transform="rotate(315 48 48)"
          />
        </g>
        <path
          fill="var(--boot-bg)"
          d="M56.34 51.45 L51.45 56.34 L44.55 56.34 L39.66 51.45 L39.66 44.55 L44.55 39.66 L51.45 39.66 L56.34 44.55 Z"
        />
        <circle cx="48" cy="48" r="7.25" fill="#d97757" />
      </svg>
    </div>
    <div class="boot-name">CLAUDE REMOTE</div>
    <div class="boot-dots"><span></span><span></span><span></span></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
