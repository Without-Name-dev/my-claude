<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#efeee9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)" />
  <!-- Same markup can be wrapped/served to iOS without a separate shell. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <title>Claude Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    // Apply the saved theme before first paint; otherwise dark-mode users get
    // a flash of the light theme while React mounts.
    (function () {
      try {
        var stored = localStorage.getItem('theme') || 'system';
        var dark =
          stored === 'dark' ||
          (stored === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
